<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="navbar">
    <div class="logo">🛒 Cart</div>
    <a href="/menu" class="btn">Back</a>
</div>

<div class="container">

{% for item in items %}
<div class="card">
    <div class="card-body">
        <h3>{{ item.name }}</h3>
        <p>₹{{ item.price }} × {{ item.quantity }}</p>

        <a href="/remove/{{ item.id }}" class="btn">Remove</a>
    </div>
</div>
{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<a href="/payment" class="btn">Proceed to Payment 💳</a>

</div>
