<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container" style="max-width:400px; margin:auto;">

    <div class="card">
        <div class="card-body">
            <h2 style="text-align:center;">Register</h2>

            <form method="POST">
                <input type="text" name="name" placeholder="Name" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc;">

                <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc;">

                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc;">

                <button type="submit" class="btn">Register</button>
            </form>

            <p style="text-align:center;">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>

</div>
